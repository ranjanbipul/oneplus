# /data/adb/smart_charge/smart_charge.conf
# Smart Battery Cycle Configuration for OnePlus 8 (Rooted)
# Designed for 24/7 plugged-in routers with frequent power cuts

# Start charging when battery drops to or below this percentage
CHARGE_START_PERCENT=50

# Stop/suspend charging when battery reaches or exceeds this percentage
CHARGE_STOP_PERCENT=85

# How often (seconds) the daemon checks battery status
CHECK_INTERVAL_SECS=15

# Safety floor: always force charging enabled if battery drops below this
SAFETY_MIN_PERCENT=25

